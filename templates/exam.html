<!DOCTYPE html>
<html>
<head>
    <title>Online Examination</title>
</head>
<body>

<h1>Online Examination</h1>

<form action="/submit" method="POST">

{% for q in questions %}

<h3>{{ q[1] }}</h3>

<input type="radio" name="{{ q[0] }}" value="{{ q[2] }}"> {{ q[2] }}<br>
<input type="radio" name="{{ q[0] }}" value="{{ q[3] }}"> {{ q[3] }}<br>
<input type="radio" name="{{ q[0] }}" value="{{ q[4] }}"> {{ q[4] }}<br>
<input type="radio" name="{{ q[0] }}" value="{{ q[5] }}"> {{ q[5] }}<br><br>

{% endfor %}

<button type="submit">Submit Exam</button>

</form>

</body>
</html>
